<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-dark-title pipeline-dark-desc" id="pipeline-dark-root">
<title id="pipeline-dark-title">Day Owl audio pipeline</title>
<desc id="pipeline-dark-desc">Host captures system audio, Opus-encodes and unicasts it over UDP to each joiner, which buffers, decodes and plays it; a separate UDP control channel handles discovery and joining.</desc>
<defs>
      <style>#pipeline-dark-root { --paper: #121110; --ink: #F2EFEA; }
      #pipeline-dark-root { color: #F2EFEA; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #pipeline-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-dark-root .n { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #F2EFEA; }
      #pipeline-dark-root .s { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #A8A29B; }
      #pipeline-dark-root .l { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; fill: #8F8982; letter-spacing: 0.06em; }
      #pipeline-dark-root .z { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 500; fill: #8F8982; letter-spacing: 0.14em; }
      #pipeline-dark-root .c { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #A8A29B; }</style>
  <marker id="pipeline-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A8A29B"/></marker>
  <marker id="pipeline-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#F2B155"/></marker>
  <marker id="pipeline-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5CD6C0"/></marker>
  <marker id="pipeline-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#A8A29B" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#121110"/>
<rect x="24" y="48" width="420" height="260" rx="8" fill="#f2efea" stroke="#f2efea" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.14"/><rect x="36" y="42" width="68" height="12" rx="2" fill="#121110"/><text class="z" x="70" y="51" text-anchor="middle">HOST PHONE</text><rect x="516" y="48" width="420" height="260" rx="8" fill="#f2efea" stroke="#f2efea" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.14"/><rect x="528" y="42" width="148" height="12" rx="2" fill="#121110"/><text class="z" x="602" y="51" text-anchor="middle">EACH JOINER · 1–5 PHONES</text><line x1="152" y1="120" x2="176" y2="120" stroke="#A8A29B" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow)"/><line x1="292" y1="120" x2="316" y2="120" stroke="#A8A29B" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow)"/><line x1="644" y1="120" x2="668" y2="120" stroke="#A8A29B" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow)"/><line x1="784" y1="120" x2="808" y2="120" stroke="#A8A29B" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow)"/><line x1="432" y1="120" x2="528" y2="120" stroke="#F2B155" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow-accent)"/><rect x="444" y="98" width="72" height="12" rx="2" fill="#121110"/><text class="l" x="480" y="107" text-anchor="middle">UDP UNICAST</text><rect x="436" y="130" width="88" height="12" rx="2" fill="#121110"/><text class="l" x="480" y="139" text-anchor="middle">~340 B / 10 MS</text><line x1="528" y1="248" x2="432" y2="248" stroke="#5CD6C0" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow-link)"/><rect x="442" y="226" width="76" height="12" rx="2" fill="#121110"/><text class="l" x="480" y="235" text-anchor="middle">PROBE · JOIN</text><line x1="432" y1="272" x2="528" y2="272" stroke="#5CD6C0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pipeline-dark-arrow-link)"/><rect x="440" y="282" width="80" height="12" rx="2" fill="#121110"/><text class="l" x="480" y="291" text-anchor="middle">INFO · ACCEPT</text><rect x="36" y="92" width="116" height="56" rx="6" fill="#121110"/><rect x="36" y="92" width="116" height="56" rx="6" fill="#121110" stroke="#F2EFEA" stroke-width="1"/><text class="n" x="94" y="118" text-anchor="middle">Capture</text><text class="s" x="94" y="134" text-anchor="middle">AudioRecord</text><rect x="176" y="92" width="116" height="56" rx="6" fill="#121110"/><rect x="176" y="92" width="116" height="56" rx="6" fill="#121110" stroke="#F2EFEA" stroke-width="1"/><text class="n" x="234" y="118" text-anchor="middle">Opus encode</text><text class="s" x="234" y="134" text-anchor="middle">48 kHz · 128 kbps</text><rect x="316" y="92" width="116" height="56" rx="6" fill="#121110"/><rect x="316" y="92" width="116" height="56" rx="6" fill="#121110" stroke="#F2EFEA" stroke-width="1"/><text class="n" x="374" y="118" text-anchor="middle">Packetize</text><text class="s" x="374" y="134" text-anchor="middle">frame N + N−1</text><rect x="528" y="92" width="116" height="56" rx="6" fill="#121110"/><rect x="528" y="92" width="116" height="56" rx="6" fill="#f2b155" stroke="#F2B155" stroke-width="1.2" fill-opacity="0.10"/><text class="n" x="586" y="118" text-anchor="middle">Jitter ring</text><text class="s" x="586" y="134" text-anchor="middle">20–150 ms</text><rect x="668" y="92" width="116" height="56" rx="6" fill="#121110"/><rect x="668" y="92" width="116" height="56" rx="6" fill="#121110" stroke="#F2EFEA" stroke-width="1"/><text class="n" x="726" y="118" text-anchor="middle">Opus decode</text><text class="s" x="726" y="134" text-anchor="middle">PLC on loss</text><rect x="808" y="92" width="116" height="56" rx="6" fill="#121110"/><rect x="808" y="92" width="116" height="56" rx="6" fill="#121110" stroke="#F2EFEA" stroke-width="1"/><text class="n" x="866" y="118" text-anchor="middle">Speaker</text><text class="s" x="866" y="134" text-anchor="middle">AudioTrack</text><text class="c" x="36" y="180">one thread, paced by the mic clock — no queue</text><text class="c" x="528" y="180">paced by the DAC — WRITE_BLOCKING</text><rect x="176" y="232" width="256" height="56" rx="6" fill="#121110"/><rect x="176" y="232" width="256" height="56" rx="6" fill="#121110" stroke="#F2EFEA" stroke-width="1"/><text class="n" x="304" y="258" text-anchor="middle">Session host</text><text class="s" x="304" y="274" text-anchor="middle">HostService · UDP :5000</text><rect x="528" y="232" width="256" height="56" rx="6" fill="#121110"/><rect x="528" y="232" width="256" height="56" rx="6" fill="#121110" stroke="#F2EFEA" stroke-width="1"/><text class="n" x="656" y="258" text-anchor="middle">Discovery + session</text><text class="s" x="656" y="274" text-anchor="middle">DiscoveryManager · :5002</text><line x1="24" y1="324" x2="936" y2="324" stroke="#f2efea" stroke-width="0.8" stroke-opacity="0.10"/><text class="z" x="24" y="344">LEGEND</text><line x1="112" y1="341" x2="140" y2="341" stroke="#F2B155" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow-accent)"/><text class="l" x="148" y="344">AUDIO STREAM</text><line x1="254" y1="341" x2="282" y2="341" stroke="#5CD6C0" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow-link)"/><text class="l" x="290" y="344">CONTROL</text><line x1="369" y1="341" x2="397" y2="341" stroke="#5CD6C0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pipeline-dark-arrow-link)"/><text class="l" x="405" y="344">REPLY / ANNOUNCE</text><line x1="534" y1="341" x2="562" y2="341" stroke="#A8A29B" stroke-width="1.2" marker-end="url(#pipeline-dark-arrow)"/><text class="l" x="570" y="344">IN-PROCESS</text>
</svg>
