<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jitter-light-title jitter-light-desc" id="jitter-light-root">
<title id="jitter-light-title">Day Owl adaptive jitter buffer</title>
<desc id="jitter-light-desc">The jitter ring primes to 3 frames, plays, and on a miss conceals with Opus PLC while raising its target; it drops a frame when too deep and lowers the target after 10 clean seconds.</desc>
<defs>
      <style>#jitter-light-root { --paper: #FBF9F7; --ink: #1A1918; }
      #jitter-light-root { color: #1A1918; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #jitter-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #jitter-light-root .n { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1A1918; }
      #jitter-light-root .s { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #4E4A45; }
      #jitter-light-root .l { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; fill: #6B655F; letter-spacing: 0.06em; }
      #jitter-light-root .z { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 500; fill: #6B655F; letter-spacing: 0.14em; }
      #jitter-light-root .c { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #4E4A45; }</style>
  <marker id="jitter-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4E4A45"/></marker>
  <marker id="jitter-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7A5900"/></marker>
  <marker id="jitter-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00695E"/></marker>
  <marker id="jitter-light-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4E4A45" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FBF9F7"/>
<circle cx="56" cy="148" r="6" fill="#1A1918"/><line x1="62" y1="148" x2="96" y2="148" stroke="#4E4A45" stroke-width="1.2" marker-end="url(#jitter-light-arrow)"/><line x1="272" y1="148" x2="392" y2="148" stroke="#4E4A45" stroke-width="1.2" marker-end="url(#jitter-light-arrow)"/><rect x="300" y="126" width="64" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="332" y="135" text-anchor="middle">≥ 3 FRAMES</text><line x1="568" y1="140" x2="688" y2="140" stroke="#4E4A45" stroke-width="1.2" marker-end="url(#jitter-light-arrow)"/><rect x="582" y="118" width="92" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="628" y="127" text-anchor="middle">MISS / TARGET+1</text><line x1="688" y1="164" x2="568" y2="164" stroke="#4E4A45" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#jitter-light-arrow)"/><rect x="588" y="174" width="80" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="628" y="183" text-anchor="middle">FRAME ARRIVES</text><path d="M448,120 V88 Q448,80 456,80 H504 Q512,80 512,88 V120" fill="none" stroke="#4E4A45" stroke-width="1.2" marker-end="url(#jitter-light-arrow)"/><rect x="428" y="58" width="104" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="67" text-anchor="middle">TOO DEEP / DROP 1</text><path d="M512,176 V208 Q512,216 504,216 H456 Q448,216 448,208 V176" fill="none" stroke="#4E4A45" stroke-width="1.2" marker-end="url(#jitter-light-arrow)"/><rect x="416" y="226" width="128" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="235" text-anchor="middle">10 S CLEAN / TARGET−1</text><rect x="96" y="120" width="176" height="56" rx="8" fill="#FBF9F7"/><rect x="96" y="120" width="176" height="56" rx="8" fill="#FBF9F7" stroke="#1A1918" stroke-width="1"/><text class="n" x="184" y="146" text-anchor="middle">Priming</text><text class="s" x="184" y="162" text-anchor="middle">fill to 30 ms</text><rect x="392" y="120" width="176" height="56" rx="8" fill="#FBF9F7"/><rect x="392" y="120" width="176" height="56" rx="8" fill="#FBF9F7" stroke="#1A1918" stroke-width="1"/><text class="n" x="480" y="146" text-anchor="middle">Playing</text><text class="s" x="480" y="162" text-anchor="middle">depth ≈ target</text><rect x="688" y="120" width="176" height="56" rx="8" fill="#FBF9F7"/><rect x="688" y="120" width="176" height="56" rx="8" fill="#7a5900" stroke="#7A5900" stroke-width="1.2" fill-opacity="0.08"/><text class="n" x="776" y="146" text-anchor="middle">Concealing</text><text class="s" x="776" y="162" text-anchor="middle">Opus PLC · hold</text><text class="c" x="688" y="216">holding play-out lets the buffer</text><text class="c" x="688" y="234">deepen to the jitter this link has</text>
</svg>
