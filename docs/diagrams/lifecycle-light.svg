<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-light-title lifecycle-light-desc" id="lifecycle-light-root">
<title id="lifecycle-light-title">Day Owl connection lifecycle</title>
<desc id="lifecycle-light-desc">Joiner discovers the host by broadcast, opens its audio port, joins, then repeats JOIN_REQUEST every 2 seconds as a heartbeat while audio streams; either side times out on silence.</desc>
<defs>
      <style>#lifecycle-light-root { --paper: #FBF9F7; --ink: #1A1918; }
      #lifecycle-light-root { color: #1A1918; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #lifecycle-light-root .diagram-container { width: 100%; overflow-x: auto; }
      #lifecycle-light-root .n { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1A1918; }
      #lifecycle-light-root .s { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #4E4A45; }
      #lifecycle-light-root .l { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; fill: #6B655F; letter-spacing: 0.06em; }
      #lifecycle-light-root .z { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 500; fill: #6B655F; letter-spacing: 0.14em; }
      #lifecycle-light-root .c { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #4E4A45; }</style>
  <marker id="lifecycle-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4E4A45"/></marker>
  <marker id="lifecycle-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7A5900"/></marker>
  <marker id="lifecycle-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00695E"/></marker>
  <marker id="lifecycle-light-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4E4A45" stroke-width="1.2"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FBF9F7"/>
<line x1="240" y1="80" x2="240" y2="480" stroke="#1a1918" stroke-dasharray="3,3" stroke-opacity="0.20"/><line x1="720" y1="80" x2="720" y2="480" stroke="#1a1918" stroke-dasharray="3,3" stroke-opacity="0.20"/><rect x="208" y="352" width="544" height="104" rx="4" fill="#1a1918" stroke="#1a1918" fill-opacity="0.02" stroke-opacity="0.22"/><rect x="208" y="352" width="44" height="16" rx="2" fill="#FBF9F7" stroke="#1a1918" stroke-opacity="0.22"/><text class="z" x="230" y="364" text-anchor="middle">LOOP</text><text class="l" x="264" y="364">[every 2 s · doubles as heartbeat]</text><line x1="240" y1="128" x2="720" y2="128" stroke="#4E4A45" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-light-arrow-open)"/><rect x="430" y="106" width="100" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="115" text-anchor="middle">DISCOVER · BCAST</text><line x1="720" y1="168" x2="240" y2="168" stroke="#4E4A45" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-light-arrow-open)"/><rect x="434" y="146" width="92" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="155" text-anchor="middle">HOST_INFO · 1 S</text><path d="M240,196 H272 Q280,196 280,204 V208 Q280,216 272,216 H244" fill="none" stroke="#4E4A45" stroke-width="1.2" marker-end="url(#lifecycle-light-arrow)"/><rect x="290" y="200" width="100" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="340" y="209" text-anchor="middle">OPEN AUDIO PORT</text><line x1="240" y1="256" x2="720" y2="256" stroke="#00695E" stroke-width="1.2" marker-end="url(#lifecycle-light-arrow-link)"/><rect x="442" y="234" width="76" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="243" text-anchor="middle">JOIN_REQUEST</text><line x1="720" y1="296" x2="240" y2="296" stroke="#00695E" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-light-arrow-link)"/><rect x="444" y="274" width="72" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="283" text-anchor="middle">JOIN_ACCEPT</text><line x1="720" y1="332" x2="240" y2="332" stroke="#7A5900" stroke-width="1.2" marker-end="url(#lifecycle-light-arrow-accent)"/><rect x="448" y="310" width="64" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="319" text-anchor="middle">OPUS AUDIO</text><line x1="240" y1="400" x2="720" y2="400" stroke="#00695E" stroke-width="1.2" marker-end="url(#lifecycle-light-arrow-link)"/><rect x="442" y="378" width="76" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="387" text-anchor="middle">JOIN_REQUEST</text><line x1="720" y1="436" x2="240" y2="436" stroke="#00695E" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-light-arrow-link)"/><rect x="444" y="414" width="72" height="12" rx="2" fill="#FBF9F7"/><text class="l" x="480" y="423" text-anchor="middle">JOIN_ACCEPT</text><rect x="160" y="24" width="160" height="56" rx="6" fill="#FBF9F7"/><rect x="160" y="24" width="160" height="56" rx="6" fill="#FBF9F7" stroke="#1A1918" stroke-width="1"/><text class="n" x="240" y="50" text-anchor="middle">Joiner</text><text class="s" x="240" y="66" text-anchor="middle">SessionManager</text><rect x="640" y="24" width="160" height="56" rx="6" fill="#FBF9F7"/><rect x="640" y="24" width="160" height="56" rx="6" fill="#7a5900" stroke="#7A5900" stroke-width="1.2" fill-opacity="0.08"/><text class="n" x="720" y="50" text-anchor="middle">Host</text><text class="s" x="720" y="66" text-anchor="middle">HostService</text><text class="c" x="196" y="404" text-anchor="end">host silent 8 s →</text><text class="c" x="196" y="422" text-anchor="end">joiner tears down</text><text class="c" x="764" y="404">← joiner silent 6 s:</text><text class="c" x="764" y="422">host evicts it</text><line x1="24" y1="492" x2="936" y2="492" stroke="#1a1918" stroke-width="0.8" stroke-opacity="0.10"/><text class="z" x="24" y="512">LEGEND</text><line x1="112" y1="509" x2="140" y2="509" stroke="#7A5900" stroke-width="1.2" marker-end="url(#lifecycle-light-arrow-accent)"/><text class="l" x="148" y="512">AUDIO</text><line x1="215" y1="509" x2="243" y2="509" stroke="#00695E" stroke-width="1.2" marker-end="url(#lifecycle-light-arrow-link)"/><text class="l" x="251" y="512">CALL</text><line x1="313" y1="509" x2="341" y2="509" stroke="#00695E" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-light-arrow-link)"/><text class="l" x="349" y="512">REPLY</text><line x1="416" y1="509" x2="444" y2="509" stroke="#4E4A45" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-light-arrow)"/><text class="l" x="452" y="512">BROADCAST</text>
</svg>
