name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# gh release create writes to the repo; read is the default.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # AGP 9.3.1 / Gradle 9.5 need 17+; 21 matches the Studio JBR
          cache: gradle

      # gradlew is committed as mode 100644, so a fresh checkout cannot execute it.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Tests run on every trigger, so a tag can never publish a build that does not pass them.
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Name the APK after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/debug/app-debug.apk "DayOwl-${GITHUB_REF_NAME}-debug.apk"

      # gh is preinstalled on the runner - no third-party release action needed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "DayOwl-${GITHUB_REF_NAME}-debug.apk" --generate-notes
